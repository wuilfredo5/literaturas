# CONFIGURACIÓN MÍNIMA Y LIMPIA

spring.application.name=literaturas
spring.datasource.url=jdbc:postgresql://localhost:5432/gutendex_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=8080
gutendex.api.url=https://gutendex.com/books

# SOLO LOGS IMPORTANTES
logging.level.root=ERROR
logging.level.com.gutendex.literaturas=INFO
logging.level.org.hibernate=ERROR
logging.level.org.springframework=ERROR
logging.level.org.springframework.web=ERROR

# Formato ultra simple
logging.pattern.console=%msg%n